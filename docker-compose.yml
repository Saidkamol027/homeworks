  services:
    postgres:
      image: postgres:15
      restart: always
      container_name: nest_postgres
      environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASS}
        POSTGRES_DB: ${DB_NAME}
      ports:
        - '${DB_PORT}:5432'
      volumes:
        - pgdata:/var/lib/postgresql/data

    redis:
      image: redis:7
      restart: always
      container_name: nest_redis
      ports:
        - '${REDIS_PORT}:6379'

    app:
      build: ./
      container_name: nest_app
      restart: always
      ports:
        - '${APP_PORT}:3000'
      depends_on:
        - postgres
        - redis
      environment:
        DB_HOST: ${DB_HOST}
        DB_PORT: ${DB_PORT}
        DB_USER: ${DB_USER}
        DB_PASS: ${DB_PASS}
        DB_NAME: ${DB_NAME}
        REDIS_HOST: ${REDIS_HOST}
        REDIS_PORT: ${REDIS_PORT}
        JWT_SECRET: ${JWT_SECRET}
        JWT_EXPIRES: ${JWT_EXPIRES}

  volumes:
    pgdata:
